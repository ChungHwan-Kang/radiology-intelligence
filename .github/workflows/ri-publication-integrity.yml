name: RI publication integrity (read-only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'posts/**'
      - 'index.html'
      - 'categories.html'
      - 'feed.xml'
      - 'sitemap.xml'
      - 'scripts/verify_publication.py'
      - 'scripts/private_editorial_gate.py'
      - 'scripts/editorial_queue.py'
      - 'scripts/editorial_pipeline.py'
      - 'scripts/snapshot_integrity.py'
      - 'scripts/snapshot_baseline.py'
      - 'tests/test_snapshot_baseline.py'
      - 'scripts/snapshot_package.py'
      - 'tests/test_snapshot_package.py'
      - 'tests/test_snapshot_integrity.py'
      - 'tests/test_editorial_pipeline.py'
      - 'tests/test_research_preview.py'
      - 'scripts/research_preview.py'
      - 'tests/test_publication_transaction.py'
      - 'tests/test_sheets_bridge.py'
      - 'scripts/publication_transaction.py'
      - 'scripts/publication_release_journal.py'
      - 'scripts/authorized_github_dispatch.py'
      - 'scripts/github_contents_adapter.py'
      - 'scripts/connected_release_preflight.py'
      - 'scripts/native_sheets_duplicate_guard.py'
      - 'scripts/native_sheets_reader.py'
      - 'tests/test_native_sheets_reader.py'
      - 'tests/test_native_sheets_duplicate_guard.py'
      - 'tests/test_connected_release_preflight.py'
      - 'tests/test_github_contents_adapter.py'
      - 'scripts/publication_site_composer.py'
      - 'tests/test_publication_site_composer.py'
      - 'tests/test_authorized_github_dispatch.py'
      - 'tests/test_publication_release_journal.py'
      - 'scripts/sheets_bridge.py'
      - 'tests/test_private_editorial_gate.py'
      - 'tests/test_editorial_queue.py'
      - '.github/workflows/ri-publication-integrity.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test editorial queue and private approval gates
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate latest approved articles
        run: |
          python scripts/verify_publication.py \
            --article ri-029-euroaim-efrs-radiographer-ai-research-survey.html \
            --article ri-030-li-rads-threshold-growth-10mm-ipd-meta-analysis.html
