<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900"><rect width="1800" height="900" fill="#FFFFFF"/><text x="80" y="78" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="50" font-weight="700" fill="#17324D">MRI 열손상 예방의 세 가지 원칙</text><text x="80" y="125" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="28" font-weight="400" fill="#667788">Remove · Insulate · Communicate</text><rect x="80" y="185" width="500" height="560" rx="30" fill="#F8FBFD" stroke="#D24B43" stroke-width="4"/><rect x="80" y="185" width="500" height="105" rx="30" fill="#D24B43"/><rect x="80" y="260" width="500" height="30" fill="#D24B43"/><text x="330" y="252" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">REMOVE</text><text x="330" y="352" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="32" font-weight="700" fill="#17324D" text-anchor="middle">제거</text><circle cx="128" cy="425" r="8" fill="#D24B43"/><text x="156" y="435" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">불필요한 전도성 물품을 제거</text><circle cx="128" cy="550" r="8" fill="#D24B43"/><text x="156" y="560" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">필요하지 않은 케이블·리드는</text><text x="156" y="596" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">사용하지 않음</text><circle cx="128" cy="675" r="8" fill="#D24B43"/><text x="156" y="685" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">의류·소지품의 전도성 소재</text><text x="156" y="721" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">가능성을 확인</text><rect x="650" y="185" width="500" height="560" rx="30" fill="#F8FBFD" stroke="#2F6DA4" stroke-width="4"/><rect x="650" y="185" width="500" height="105" rx="30" fill="#2F6DA4"/><rect x="650" y="260" width="500" height="30" fill="#2F6DA4"/><text x="900" y="252" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">INSULATE</text><text x="900" y="352" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="32" font-weight="700" fill="#17324D" text-anchor="middle">분리·절연</text><circle cx="698" cy="425" r="8" fill="#2F6DA4"/><text x="726" y="435" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">피부-피부 직접 접촉을 분리</text><circle cx="698" cy="550" r="8" fill="#2F6DA4"/><text x="726" y="560" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">피부와 보어·전송 RF 코일 사이</text><text x="726" y="596" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">충분한 거리를 확보</text><circle cx="698" cy="675" r="8" fill="#2F6DA4"/><text x="726" y="685" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">케이블·전도성 물질이 피부에</text><text x="726" y="721" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">직접 닿지 않게 함</text><rect x="1220" y="185" width="500" height="560" rx="30" fill="#F8FBFD" stroke="#3D8A67" stroke-width="4"/><rect x="1220" y="185" width="500" height="105" rx="30" fill="#3D8A67"/><rect x="1220" y="260" width="500" height="30" fill="#3D8A67"/><text x="1470" y="252" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">COMMUNICATE</text><text x="1470" y="352" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="32" font-weight="700" fill="#17324D" text-anchor="middle">소통</text><circle cx="1268" cy="425" r="8" fill="#3D8A67"/><text x="1296" y="435" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">열감·따끔거림·통증을</text><text x="1296" y="471" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">즉시 알리도록 설명</text><circle cx="1268" cy="550" r="8" fill="#3D8A67"/><text x="1296" y="560" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">검사 중 환자 상태를</text><text x="1296" y="596" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">정기적으로 확인</text><circle cx="1268" cy="675" r="8" fill="#3D8A67"/><text x="1296" y="685" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">불편감이 발생하면</text><text x="1296" y="721" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="24" fill="#1F2937">즉시 중단·평가</text><text x="80" y="815" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="23" font-weight="700" fill="#17324D">실무 적용 시에는 해당 MR 시스템 제조사 IFU와 기관 절차를 우선합니다.</text><text x="80" y="858" font-family="Noto Sans CJK KR, Noto Sans CJK" font-size="19" fill="#667788">Source: Baker C, et al. J Med Radiat Sci. 2024;71(3):445-460. DOI 10.1002/jmrs.800; ACR Manual on MR Safety 2026.</text></svg>